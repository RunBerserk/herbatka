[package]
name = "herbatka"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A lightweight event streaming broker inspired by Apache Kafka, focused on simplicity, resilience, and fast iteration."
license = "MIT"
repository = "https://github.com/RunBerserk/herbatka"
readme = "README.md"
keywords = ["kafka", "broker", "messaging", "streaming", "log"]
categories = ["network-programming", "database-implementations"]

[dependencies]
prost = "0.13"
eframe = "0.33.3"
egui = "0.33.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

