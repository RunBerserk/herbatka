[package]
name = "herbatka-ui"
version = "0.7.9"
edition = "2024"
rust-version = "1.90"
description = "Desktop fleet-style UI for Herbatka (egui)."
license = "MIT"
repository = "https://github.com/RunBerserk/herbatka"

[lib]
name = "herbatka_ui"
path = "src/lib.rs"

[dependencies]
eframe = "0.33.3"
egui = "0.33.3"
herbatka-wire = { path = "../herbatka-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1"

[[bin]]
name = "herbatka-ui"
path = "src/main.rs"

[[bin]]
name = "ui"
path = "src/bin/ui.rs"
