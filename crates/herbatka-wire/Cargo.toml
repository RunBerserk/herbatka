[package]
name = "herbatka-wire"
version = "0.7.9"
edition = "2024"
rust-version = "1.90"
description = "Herbatka TCP wire protocol (framed v1), commands, and fleet protobuf bindings."
license = "MIT"
repository = "https://github.com/RunBerserk/herbatka"

[dependencies]
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
